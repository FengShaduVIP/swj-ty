name: Build Windows EXE

on:
  # 手动触发（在 GitHub 仓库 Actions 页面点 Run workflow，仅产出 artifact）
  workflow_dispatch:
  # 推送 tag 时自动打包并发布到 GitHub Release（如 v1.0.0）
  push:
    tags:
      - 'v*'

# 发布到 Release 需要写权限
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    env:
      # Electron 二进制镜像（国内/CDN 可达，避免 GitHub Releases 下载慢）
      ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
      # pnpm 允许原生模块构建脚本（对应 pnpm-workspace.yaml 的 allowBuilds）
      PNPM_HOME: ${{ github.workspace }}/.pnpm-store

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSVC Build Tools (for node-gyp / native modules)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows EXE
        run: pnpm electron:build:win

      # 仅「手动触发」时上传 artifact（会占用 GitHub 存储配额）。
      # 推 tag 走下面的 Release 发布，Release 资产不占 artifact 配额，避免配额被打满。
      # continue-on-error：即使配额已满导致上传失败，也不阻断后续 Release 发布。
      - name: Upload EXE artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: serial-modbus-tool-win64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 3

      # 仅当推送 tag 时，发布到 GitHub Release。
      # 必须包含 latest.yml 与 *.blockmap：electron-updater 靠 latest.yml 比对版本，
      # blockmap 用于差分下载，缺失会导致自动更新检查失败。
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
