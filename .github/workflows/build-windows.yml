name: Build Windows EXE

on:
  # 手动触发（在 GitHub 仓库 Actions 页面点 Run workflow，仅产出 artifact）
  workflow_dispatch:
  # 推送 tag 时自动打包并发布到 GitHub Release（如 v1.0.0）
  push:
    tags:
      - 'v*'

# 发布到 Release 需要写权限
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    env:
      # Electron 二进制镜像（国内/CDN 可达，避免 GitHub Releases 下载慢）
      ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
      # pnpm 允许原生模块构建脚本（对应 pnpm-workspace.yaml 的 allowBuilds）
      PNPM_HOME: ${{ github.workspace }}/.pnpm-store

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSVC Build Tools (for node-gyp / native modules)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows EXE
        run: pnpm electron:build:win

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: serial-modbus-tool-win64
          path: release/*.exe
          if-no-files-found: error

      # 仅当推送 tag 时，把 exe 自动发布到 GitHub Release
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
