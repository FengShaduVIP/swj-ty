appId: com.serial.modbus-tool
productName: 串口Modbus调试工具
copyright: Copyright © 2024

# 关闭 electron-builder 的原生模块重编译：serialport/bindings-cpp 已通过
# pnpm install 阶段用预编译 N-API 二进制装好（ABI 稳定，Node/Electron 通用），
# 无需再 node-gyp 编译。GitHub windows-latest 镜像默认无 VS 编译工具，重编译必失败。
npmRebuild: false

# 禁止自动发布：electron-builder 检测到 CI 环境时会尝试发布到 GitHub Releases，
# 需要 GH_TOKEN。我们只需要本地产出 exe，不需要自动发布。
publish: null

directories:
  output: release
  buildResources: public

files:
  - dist
  - dist-electron

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/serialport/**"
  - "node_modules/@serialport/**"

extraMetadata:
  main: dist-electron/main.js
